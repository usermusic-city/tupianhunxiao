<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片混淆工具</title>
<style>
:root {
    --bg: #05050d;
    --cyan: #05d9e8;
    --magenta: #ff2a6d;
    --gray: #19192b;
    --text: #d1f7ff;
}
@media (prefers-color-scheme: light) {
    :root {--bg:#101020;}
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", Consolas, monospace;
}
body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(5,217,232,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(5,217,232,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    z-index: -2;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(transparent 0px, transparent 3px, rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 6px);
    pointer-events: none;
    opacity: 0.25;
    z-index: -1;
}
.container {
    max-width: 700px;
    margin: 0 auto;
}
.cyber-card {
    background: rgba(10,10,20,0.85);
    border: 1px solid var(--cyan);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    padding: 26px;
    margin-bottom: 20px;
    box-shadow: 0 0 18px rgba(5,217,232,0.2);
}
.glitch-title {
    position: relative;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 18px;
    font-weight: bold;
}
.glitch-title::before {
    content: attr(data-text);
    position: absolute;
    left: -2px;
    color: var(--magenta);
    opacity: 0.7;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
    animation: glitch 2.2s infinite alternate-reverse;
}
@keyframes glitch {
    0% {transform: translateX(0)}
    20% {transform: translateX(-2px)}
    40% {transform: translateX(2px)}
    60% {transform: translateX(-1px)}
    80% {transform: translateX(1px)}
    100% {transform: translateX(0)}
}
.desc {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 20px;
}
.btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    letter-spacing: 1px;
    font-size: 14px;
    cursor: pointer;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    transition: 0.2s ease;
}
.btn:hover {
    background: rgba(5,217,232,0.15);
    box-shadow: 0 0 22px rgba(5,217,232,0.45);
    color: #ffffff;
}
.btn-magenta {
    border-color: var(--magenta);
    color: var(--magenta);
}
.btn-magenta:hover {
    background: rgba(255,42,109,0.15);
    box-shadow: 0 0 22px rgba(255,42,109,0.45);
}
.canvas-box {
    width: 100%;
    min-height: 220px;
    border: 1px dashed rgba(5,217,232,0.4);
    margin: 18px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-align: center;
    opacity: 0.8;
}
canvas {
    max-width: 100%;
    height: auto;
    display: block;
}
.row-flex {
    display: flex;
    gap: 12px;
}
input[type=file] {
    display: none;
}
</style>
</head>
<body>
<div class="container">
    <div class="cyber-card">
        <div class="glitch-title" data-text="图片混淆工具">图片混淆工具</div>
        <div class="desc">本地离线处理 · 图片不上传服务器 · 支持多层混淆与逐层还原</div>

        <input id="fileLoader" type="file" accept="image/*">
        <button class="btn" onclick="document.getElementById('fileLoader').click()">选择图片</button>

        <div class="canvas-box" id="canvasWrap">预览区域</div>
        <canvas id="mainCanvas"></canvas>

        <div class="row-flex">
            <button class="btn" id="obscureBtn">混淆（可多次叠加）</button>
            <button class="btn btn-magenta" id="restoreBtn">解混淆（逐层还原）</button>
        </div>
        <button class="btn btn-magenta" id="downloadImgBtn">下载图片</button>
    </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileLoader');
const wrap = document.getElementById('canvasWrap');
const obscureBtn = document.getElementById('obscureBtn');
const restoreBtn = document.getElementById('restoreBtn');
const downloadBtn = document.getElementById('downloadImgBtn');

let originalImg = null;
let width = 0;
let height = 0;

// 生成吉尔伯特曲线坐标序列
function gilbertCurve(n) {
    let points = [];
    function d(x, y, size, direction) {
        if (size === 1) {
            points.push([x, y]);
            return;
        }
        const half = size / 2;
        switch (direction) {
            case 0:
                d(x, y, half, 1);
                d(x, y + half, half, 0);
                d(x + half, y + half, half, 0);
                d(x + half, y, half, 3);
                break;
            case 1:
                d(x, y, half, 0);
                d(x + half, y, half, 1);
                d(x + half, y + half, half, 1);
                d(x, y + half, half, 2);
                break;
            case 2:
                d(x + half, y + half, half, 3);
                d(x + half, y, half, 2);
                d(x, y, half, 2);
                d(x, y + half, half, 1);
                break;
            case 3:
                d(x + half, y, half, 2);
                d(x, y, half, 3);
                d(x, y + half, half, 3);
                d(x + half, y + half, half, 0);
                break;
        }
    }
    d(0, 0, n, 0);
    return points;
}

// 对齐尺寸到2的幂次
function getPowerTwo(val) {
    let v = 1;
    while (v < val) v <<= 1;
    return v;
}

// 正向混淆（可重复叠加）
function encodeOnce() {
    if (!originalImg) return;
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data.slice();
    const size = getPowerTwo(Math.max(canvas.width, canvas.height));
    const curve = gilbertCurve(size);
    const step = Math.floor(curve.length * ((Math.sqrt(5)-1)/2));

    for(let i=0;i<curve.length;i++){
        const srcIdx = i;
        const dstIdx = (i + step) % curve.length;

        let x1 = curve[srcIdx][0];
        let y1 = curve[srcIdx][1];
        let x2 = curve[dstIdx][0];
        let y2 = curve[dstIdx][1];

        if(x1 >= canvas.width || y1 >= canvas.height) continue;
        if(x2 >= canvas.width || y2 >= canvas.height) continue;

        const pos1 = (y1 * canvas.width + x1) * 4;
        const pos2 = (y2 * canvas.width + x2) * 4;

        imgData.data[pos2] = data[pos1];
        imgData.data[pos2+1] = data[pos1+1];
        imgData.data[pos2+2] = data[pos1+2];
        imgData.data[pos2+3] = data[pos1+3];
    }
    ctx.putImageData(imgData,0,0);
}

// 反向解密（逐层还原）
function decodeOnce() {
    if (!originalImg) return;
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data.slice();
    const size = getPowerTwo(Math.max(canvas.width, canvas.height));
    const curve = gilbertCurve(size);
    const step = Math.floor(curve.length * ((Math.sqrt(5)-1)/2));

    for(let i=0;i<curve.length;i++){
        const dstIdx = i;
        const srcIdx = (i + step) % curve.length;

        let x1 = curve[srcIdx][0];
        let y1 = curve[srcIdx][1];
        let x2 = curve[dstIdx][0];
        let y2 = curve[dstIdx][1];

        if(x1 >= canvas.width || y1 >= canvas.height) continue;
        if(x2 >= canvas.width || y2 >= canvas.height) continue;

        const pos1 = (y1 * canvas.width + x1) * 4;
        const pos2 = (y2 * canvas.width + x2) * 4;

        imgData.data[pos2] = data[pos1];
        imgData.data[pos2+1] = data[pos1+1];
        imgData.data[pos2+2] = data[pos1+2];
        imgData.data[pos2+3] = data[pos1+3];
    }
    ctx.putImageData(imgData,0,0);
}

fileInput.onchange = function (e) {
    if (!e.target.files || !e.target.files[0]) return;
    const reader = new FileReader();
    reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
            originalImg = img;
            width = img.naturalWidth;
            height = img.naturalHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0);
            wrap.style.display = "none";
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
};

obscureBtn.onclick = encodeOnce;
restoreBtn.onclick = decodeOnce;

downloadBtn.onclick = function () {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const fileName = `处理结果_${y}${m}${d}_${h}${min}${s}.png`;

    const link = document.createElement('a');
    link.download = fileName;
    link.href = canvas.toDataURL("image/png");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};
</script>
</body>
</html>
