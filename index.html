<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片混淆工具</title>
<style>
:root {
    --bg: #05050d;
    --cyan: #05d9e8;
    --magenta: #ff2a6d;
    --gray: #19192b;
    --text: #d1f7ff;
}
@media (prefers-color-scheme: light) {
    :root {--bg:#101020;}
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", Consolas, monospace;
}
body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(5,217,232,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(5,217,232,0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    z-index: -2;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(transparent 0px, transparent 3px, rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 6px);
    pointer-events: none;
    opacity: 0.25;
    z-index: -1;
}
.container {
    max-width: 700px;
    margin: 0 auto;
}
.cyber-card {
    background: rgba(10,10,20,0.85);
    border: 1px solid var(--cyan);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    padding: 26px;
    margin-bottom: 20px;
    box-shadow: 0 0 18px rgba(5,217,232,0.2);
}
.glitch-title {
    position: relative;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 18px;
    font-weight: bold;
}
.glitch-title::before {
    content: attr(data-text);
    position: absolute;
    left: -2px;
    color: var(--magenta);
    opacity: 0.7;
    clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
    animation: glitch 2.2s infinite alternate-reverse;
}
@keyframes glitch {
    0% {transform: translateX(0)}
    20% {transform: translateX(-2px)}
    40% {transform: translateX(2px)}
    60% {transform: translateX(-1px)}
    80% {transform: translateX(1px)}
    100% {transform: translateX(0)}
}
.desc {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 20px;
}
.btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    letter-spacing: 1px;
    font-size: 14px;
    cursor: pointer;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    transition: 0.2s ease;
}
.btn:hover {
    background: rgba(5,217,232,0.15);
    box-shadow: 0 0 22px rgba(5,217,232,0.45);
    color: #ffffff;
}
.btn-magenta {
    border-color: var(--magenta);
    color: var(--magenta);
}
.btn-magenta:hover {
    background: rgba(255,42,109,0.15);
    box-shadow: 0 0 22px rgba(255,42,109,0.45);
}
.canvas-box {
    width: 100%;
    min-height: 220px;
    border: 1px dashed rgba(5,217,232,0.4);
    margin: 18px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-align: center;
    opacity: 0.8;
}
canvas {
    max-width: 100%;
    height: auto;
    display: block;
}
.row-flex {
    display: flex;
    gap: 12px;
}
input[type=file] {
    display: none;
}
</style>
</head>
<body>
<div class="container">
    <div class="cyber-card">
        <div class="glitch-title" data-text="图片混淆工具">图片混淆工具</div>
        <div class="desc">本地离线处理 · 图片不上传服务器 · 支持混淆与还原</div>

        <input id="fileLoader" type="file" accept="image/*">
        <button class="btn" onclick="document.getElementById('fileLoader').click()">选择图片</button>

        <div class="canvas-box" id="canvasWrap">预览区域</div>
        <canvas id="mainCanvas"></canvas>

        <div class="row-flex">
            <button class="btn" id="obscureBtn">混淆</button>
            <button class="btn btn-magenta" id="restoreBtn">解混淆</button>
        </div>
        <button class="btn btn-magenta" id="downloadImgBtn">下载图片</button>
    </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileLoader');
const wrap = document.getElementById('canvasWrap');
const obscureBtn = document.getElementById('obscureBtn');
const restoreBtn = document.getElementById('restoreBtn');
const downloadBtn = document.getElementById('downloadImgBtn');

let originalImg = null;
let processedImageData = null;

// Gilbert 曲线核心算法
function z(t, n) {
    const e = [];
    return t >= n ? p(0, 0, t, 0, 0, n, e) : p(0, 0, 0, n, t, 0, e), e;
}

function p(t, n, e, o, c, a, r) {
    const m = Math.abs(e + o), l = Math.abs(c + a), u = Math.sign(e), d = Math.sign(o), L = Math.sign(c), s = Math.sign(a);
    if (l === 1) {
        for (let M = 0; M < m; M++) {
            r.push([t, n]), t += u, n += d;
        }
        return;
    }
    if (m === 1) {
        for (let M = 0; M < l; M++) {
            r.push([t, n]), t += L, n += s;
        }
        return;
    }
    let h = Math.floor(e / 2), g = Math.floor(o / 2), i = Math.floor(c / 2), f = Math.floor(a / 2);
    const S = Math.abs(h + g), _ = Math.abs(i + f);
    2 * m > 3 * l ? (S % 2 && m > 2 && (h += u, g += d), p(t, n, h, g, c, a, r), p(t + h, n + g, e - h, o - g, c, a, r)) : (_ % 2 && l > 2 && (i += L, f += s), p(t, n, i, f, h, g, r), p(t + i, n + f, e, o, c - i, a - f, r), p(t + (e - u) + (i - L), n + (o - d) + (f - s), -i, -f, -(e - h), -(o - g), r));
}

function gilbertProcess(type) {
    if (!originalImg) return;

    const img = originalImg;
    const maxPixels = 8000000;
    const maxSide = 4000;

    let width = img.naturalWidth || img.width;
    let height = img.naturalHeight || img.height;
    let scale = 1;

    if (width * height > maxPixels) {
        scale = Math.sqrt(maxPixels / (width * height));
    }
    if (width > maxSide) scale = Math.min(scale, maxSide / width);
    if (height > maxSide) scale = Math.min(scale, maxSide / height);

    if (scale < 1) {
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
    }

    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(img, 0, 0, width, height);

    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const order = z(width, height);
    const total = order.length;
    const step = Math.round((Math.sqrt(5) - 1) / 2 * total);

    const temp = new Uint8ClampedArray(data);

    for (let i = 0; i < total; i++) {
        const src = type === 'enc' ? i : (i + step) % total;
        const dst = type === 'enc' ? (i + step) % total : i;

        const srcPos = order[src];
        const dstPos = order[dst];

        const srcIdx = 4 * (srcPos[0] + srcPos[1] * width);
        const dstIdx = 4 * (dstPos[0] + dstPos[1] * width);

        data[dstIdx] = temp[srcIdx];
        data[dstIdx + 1] = temp[srcIdx + 1];
        data[dstIdx + 2] = temp[srcIdx + 2];
        data[dstIdx + 3] = temp[srcIdx + 3];
    }

    ctx.putImageData(imageData, 0, 0);
    processedImageData = imageData;
}

fileInput.onchange = function (e) {
    if (!e.target.files || !e.target.files[0]) return;

    const reader = new FileReader();
    reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
            originalImg = img;
            wrap.style.display = "none";

            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            ctx.drawImage(img, 0, 0);
            processedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
};

obscureBtn.onclick = function () {
    gilbertProcess('enc');
};

restoreBtn.onclick = function () {
    gilbertProcess('dec');
};

downloadBtn.onclick = function () {
    if (!processedImageData) return;

    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');

    const fileName = `处理结果_${y}${m}${d}_${h}${min}${s}.png`;

    const link = document.createElement('a');
    link.download = fileName;
    link.href = canvas.toDataURL("image/png");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};
</script>
</body>
</html>
